spring:
  profiles:
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms                # 连接超时 3 秒
      # Lettuce 连接池配置（性能优化）
      lettuce:
        pool:
          max-active: 50             # 最大连接数（默认 8 → 50）
          max-idle: 20               # 最大空闲连接（保持 20 个）
          min-idle: 10               # 最小空闲连接（预热 10 个）
          max-wait: 1000ms           # 最多等待 1 秒
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    #消息确认机制
    publisher-confirm-type: correlated
    publisher-returns: true
    #消费者配置
    listener:
      simple:
        acknowledge-mode: auto # 自动确认消息
        retry:
          enabled: true
          max-attempts: 3 # 最大重试3次
          delay: 1000ms
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  elasticsearch:
    connection-timeout: 5s

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${dashscope.api-key}
        model-name: qwen-plus
        temperature: 0.7
        timeout: 30s
      streaming-chat-model:
        api-key: ${dashscope.api-key}
        model-name: qwen-plus
        temperature: 0.7
      embedding-model:
        api-key: ${dashscope.api-key}
        model-name: text-embedding-v4

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: 2956195122zzzjjjwww2956195122zzzjjjwww
  expire-hours: 720
  header: Authorization

sms:
  code-expire-minutes: 5
  code-length: 6

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
  compression:
    enabled: false

bigmodel:
  api-key: ${bigmodel.api-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: consultant
#日志配置
logging:
  level:
    root: INFO # 全局只输出 INFO 及以上
